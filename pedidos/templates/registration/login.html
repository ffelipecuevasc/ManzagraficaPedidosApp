{% load static %}
<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Manza Gráfica</title>

    <link rel="icon" type="image/svg+xml" href="{% static 'pedidos/img/favicon.svg' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#FBBF24",
                        "background-light": "#F9FAFB",
                        "background-dark": "#0A0A0A",
                        "card-dark": "#171717",
                    },
                    fontFamily: {
                        display: ["Bebas Neue", "sans-serif"],
                        sans: ["Inter", "sans-serif"],
                    },
                },
            },
        };
    </script>
    <link href="{% static 'pedidos/css/index.css' %}" rel="stylesheet">

    <style>
        .material-icons-round {
            font-family: 'Material Icons Round';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
            -webkit-font-smoothing: antialiased;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex items-center justify-center p-4 transition-colors duration-300">

<div class="w-full max-w-md">
    <div class="bg-white dark:bg-card-dark rounded-2xl shadow-xl overflow-hidden border border-slate-200 dark:border-neutral-800">

        <div class="p-8 pb-6 text-center border-b border-slate-100 dark:border-neutral-800">
            <div class="inline-flex flex-col items-center justify-center">
                    <span class="display-font text-5xl tracking-tight text-slate-900 dark:text-white">
                        MANZA <span class="bg-primary text-black px-2 transform -skew-x-6 inline-block">GRÁFICA</span>
                    </span>
                <span class="text-[10px] tracking-[0.3em] font-bold text-slate-400 dark:text-slate-500 mt-2 uppercase">Sistema de Control Interno</span>
            </div>
        </div>

        <div class="p-8">
            <h2 class="text-xl font-semibold text-slate-800 dark:text-white mb-6 text-center">Bienvenido</h2>

            {% if form.errors %}
                <div class="mb-6 bg-red-50 dark:bg-red-900/20 border-l-4 border-red-500 p-4 rounded-r flex items-center animate-pulse">
                    <div class="flex-shrink-0">
                        <span class="material-icons-round text-red-500 text-2xl">gpp_bad</span>
                    </div>
                    <div class="ml-3">
                        <p class="text-sm text-red-700 dark:text-red-400 font-bold">Credenciales incorrectas</p>
                        <p class="text-xs text-red-600 dark:text-red-300 mt-0.5">Usuario o contraseña no válidos.</p>
                    </div>
                </div>
            {% endif %}

            <form method="post" action="{% url 'login' %}" class="space-y-5">
                {% csrf_token %}

                <input type="hidden" name="next" value="{{ next }}">

                <div>
                    <label for="id_username" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">
                        Usuario
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <span class="material-icons-round text-slate-400 text-lg">person</span>
                        </div>
                        <input type="text" name="username" id="id_username" required
                               class="!pl-12 block w-full rounded-lg border-slate-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 text-slate-900 dark:text-white focus:ring-primary focus:border-primary sm:text-sm shadow-sm transition-all"
                               placeholder="Ej: admin">
                    </div>
                </div>

                <div>
                    <label for="id_password" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">
                        Contraseña
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <span class="material-icons-round text-slate-400 text-lg">lock</span>
                        </div>
                        <input type="password" name="password" id="id_password" required
                               class="!pl-12 block w-full rounded-lg border-slate-300 dark:border-neutral-700 bg-white dark:bg-neutral-800 text-slate-900 dark:text-white focus:ring-primary focus:border-primary sm:text-sm shadow-sm transition-all"
                               placeholder="••••••••">
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit"
                            class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-lg shadow-md text-sm font-bold text-black bg-primary hover:bg-yellow-400 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-yellow-500 transition-all uppercase tracking-wide transform active:scale-95">
                        Ingresar al Sistema
                        <span class="material-icons-round text-lg ml-2">login</span>
                    </button>
                </div>
            </form>
        </div>

        <div class="px-8 py-4 bg-slate-50 dark:bg-black/20 text-center border-t border-slate-100 dark:border-neutral-800">
            <p class="text-xs text-slate-500 dark:text-slate-400">
                &copy; 2026 Manza Gráfica App
            </p>
        </div>
    </div>

    <div class="mt-6 text-center">
        <button id="theme-toggle"
                class="text-xs font-medium text-slate-500 hover:text-slate-800 dark:text-slate-500 dark:hover:text-slate-300 transition-colors inline-flex items-center gap-2">
            <span class="material-icons-round text-base">contrast</span>
            <span class="hidden dark:inline">Cambiar a Modo Claro</span>
            <span class="inline dark:hidden">Cambiar a Modo Oscuro</span>
        </button>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="{% static 'pedidos/js/index.js' %}"></script>
</body>
</html>
